spring:
  application:
    name: agente-sql

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.8-flash

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aad_db}
    username: ${DB_READONLY_USER:sql_agent}
    password: ${DB_READONLY_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      read-only: true

  jdbc:
    template:
      query-timeout: 10