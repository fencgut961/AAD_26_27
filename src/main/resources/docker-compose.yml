services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-tutor
    restart: always
    environment:
      POSTGRES_DB: educa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monta el script SQL para que cargue los datos al arrancar por primera vez
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: