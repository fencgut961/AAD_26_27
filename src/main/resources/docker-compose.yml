services:
  postgres-db:
    image: postgres:16-alpine
    container_name: aad-container
    restart: always
    environment:
      POSTGRES_DB: aad_postgres_db
      POSTGRES_USER: aad_postgres_user
      POSTGRES_PASSWORD: aad_postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monta el script SQL para que cargue los datos al arrancar por primera vez
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: